# fly.io 部署配置 (warp-pool 网关 + WARP 节点池)
# 用法: fly launch --no-deploy 后先建卷再 deploy, 见 deploy/fly/README.md
app = "warp-pool"          # fly app 名; 改名的话同步改 opencode 配置里的 baseURL

primary_region = "nrt"     # 离你近的区域; 列表见 fly.io/docs/reference/regions

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  NODE_COUNT = "5"         # 256MB 机器建议 5 个节点(每个 wireproxy ~20MB)
  BASE_PORT = "10800"
  HEALTH_EVERY = "300"

[mounts]
  source = "warp_pool_data"     # 先 `fly volumes create warp_pool_data --size 3 --region nrt`
  destination = "/opt/warp-pool" # 持久化 nodes/ 私钥 + state/, 重启不换 IP

[vm]
  size = "shared-cpu-1x"
  memory = "256mb"

[[restart]]
  policy = "always"

[[services]]
  internal_port = 10900
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = true

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "get"
    path = "/healthz"
